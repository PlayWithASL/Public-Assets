name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "Deploy action"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - rollback

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read deploy config
        id: config
        run: |
          if [ ! -f deploy.ssm.yml ]; then
            echo "No deploy.ssm.yml found — skipping deployment"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          PATTERN=$(grep '^pattern:' deploy.ssm.yml | awk '{print $2}')
          echo "pattern=$PATTERN" >> "$GITHUB_OUTPUT"

          # Extract pattern-specific target params
          TARGET_BUCKET=$(grep 'target_bucket:' deploy.ssm.yml | awk '{print $2}' || true)
          CF_DIST=$(grep 'cloudfront_distribution_id:' deploy.ssm.yml | awk '{print $2}' | tr -d '"' || true)
          CORPUS_BUCKET=$(grep 'corpus_bucket:' deploy.ssm.yml | awk '{print $2}' || true)
          KB_ID=$(grep 'knowledge_base_id:' deploy.ssm.yml | awk '{print $2}' || true)
          DS_ID=$(grep 'data_source_id:' deploy.ssm.yml | awk '{print $2}' || true)
          echo "target_bucket=${TARGET_BUCKET}" >> "$GITHUB_OUTPUT"
          echo "cf_dist=${CF_DIST}" >> "$GITHUB_OUTPUT"
          echo "corpus_bucket=${CORPUS_BUCKET}" >> "$GITHUB_OUTPUT"
          echo "kb_id=${KB_ID}" >> "$GITHUB_OUTPUT"
          echo "ds_id=${DS_ID}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        if: steps.config.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package artifact
        if: steps.config.outputs.skip != 'true'
        run: |
          REPO_SLUG=$(echo "${{ github.repository }}" | cut -d/ -f2 | tr '[:upper:]' '[:lower:]')
          COMMIT_SHA="${{ github.sha }}"
          ARTIFACT_NAME="${REPO_SLUG}/${COMMIT_SHA}.tar.gz"

          tar -czf /tmp/artifact.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.github' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.env*' \
            .

          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_ENV"
          echo "repo_slug=${REPO_SLUG}" >> "$GITHUB_ENV"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_ENV"

      - name: Upload artifact to S3
        if: steps.config.outputs.skip != 'true'
        run: |
          aws s3 cp /tmp/artifact.tar.gz \
            "s3://${{ secrets.DEPLOY_ARTIFACTS_BUCKET }}/${artifact_name}"

      - name: Trigger SSM Automation
        if: steps.config.outputs.skip != 'true'
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d/ -f2)
          PATTERN="${{ steps.config.outputs.pattern }}"
          ACTION="${{ github.event.inputs.action || 'deploy' }}"

          # Build base parameters
          PARAMS="{\"Repo\":[\"${REPO_NAME}\"],\"CommitSha\":[\"${commit_sha}\"],\"Environment\":[\"production\"],\"AutomationAssumeRole\":[\"${{ secrets.AWS_SSM_AUTOMATION_ROLE_ARN }}\"]"

          # Add pattern-specific parameters
          if [ "$PATTERN" = "s3-static-deploy" ]; then
            PARAMS="${PARAMS},\"TargetBucket\":[\"${{ steps.config.outputs.target_bucket }}\"]"
            CF_DIST="${{ steps.config.outputs.cf_dist }}"
            if [ -n "$CF_DIST" ]; then
              PARAMS="${PARAMS},\"CloudFrontDistributionId\":[\"${CF_DIST}\"]"
            fi
          elif [ "$PATTERN" = "s3-corpus-deploy" ]; then
            PARAMS="${PARAMS},\"CorpusBucket\":[\"${{ steps.config.outputs.corpus_bucket }}\"]"
            PARAMS="${PARAMS},\"KnowledgeBaseId\":[\"${{ steps.config.outputs.kb_id }}\"]"
            PARAMS="${PARAMS},\"DataSourceId\":[\"${{ steps.config.outputs.ds_id }}\"]"
          fi

          PARAMS="${PARAMS}}"

          EXECUTION_ID=$(aws ssm start-automation-execution \
            --document-name "playwithasl-${PATTERN}" \
            --parameters "$PARAMS" \
            --query 'AutomationExecutionId' \
            --output text)

          echo "SSM Automation started: ${EXECUTION_ID}"
          echo "execution_id=${EXECUTION_ID}" >> "$GITHUB_ENV"

      - name: Wait for automation
        if: steps.config.outputs.skip != 'true'
        run: |
          echo "Waiting for SSM Automation ${execution_id}..."
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-automation-execution \
              --automation-execution-id "${execution_id}" \
              --query 'AutomationExecution.AutomationExecutionStatus' \
              --output text)

            case $STATUS in
              Success)
                echo "Deployment succeeded!"
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "Deployment ${STATUS}!"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for automation"
          exit 1

      - name: Post deploy summary
        if: always() && steps.config.outputs.skip != 'true'
        run: |
          echo "## Deploy Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Repo:** ${{ github.repository }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Pattern:** ${{ steps.config.outputs.pattern }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Triggered by:** ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
